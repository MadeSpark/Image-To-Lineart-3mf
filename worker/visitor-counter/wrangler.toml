name = "visitor-counter"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# 计数存储在 KV 中，需要先创建 namespace 再绑定到这里。
# 新版 wrangler (v3.60+) 命令用空格分隔（旧版用冒号 kv:namespace 已弃用）：
#   npx wrangler kv namespace create VISITOR_COUNT
# 推荐加 --update-config 让 wrangler 自动把 id 写回本文件：
#   npx wrangler kv namespace create VISITOR_COUNT --update-config
# 或手动把命令输出的 id 替换到下方 binding 的 id 字段。
[[kv_namespaces]]
binding = "VISITOR_COUNT"
id = "0c8ac6229e2b48699c7a4767a69814a5"

[[durable_objects.bindings]]
name = "VISITOR_COUNTER"
class_name = "VisitorCounter"

[[migrations]]
tag = "v1"
new_classes = ["VisitorCounter"]

# 允许调用本 Worker 的前端域名（逗号分隔，不要带尾随斜杠）。
# 包含本地开发地址 + webapp 公网部署域名。
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://lineart.madespark.cc"
